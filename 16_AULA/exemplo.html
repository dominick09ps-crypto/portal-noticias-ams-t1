<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Prático</title>

    <style>
        .palco {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 260px;
            background: linear-gradient(135deg, green, lightgreen);
            border-radius: 12px;
            color: white;
            padding: 20px;
        }

        .palco .cartaz {
            background-color: rgba(0, 0, 0, 0.25);
            border: 2px solid orange;
            border-radius: 10px;
            padding: 18px 24px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <section class="palco">
        <div class="cartaz">Abertura Oficial - 19h</div>
    </section>

</body>

</html>
