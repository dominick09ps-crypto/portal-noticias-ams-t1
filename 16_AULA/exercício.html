<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Fixação</title>

    <style>
        .banner-boas-vindas {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 220px;
            background: linear-gradient(135deg, blue, lightblue);
            color: white;
            text-align: center;
        }

        .banner-boas-vindas a {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            color: darkblue;
            background: white;
        }
    </style>
</head>

<body>
    <section class="banner-boas-vindas">
        <div>
            <h2>Bem-vindos ao Festival Cultural</h2>
            <a href="#programacao">Ver programação</a>
        </div>
    </section>

</body>

</html>
