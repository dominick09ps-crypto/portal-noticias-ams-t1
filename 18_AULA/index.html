<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários: do HTML ao Visual Moderno</title>

    <style>
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid gray;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            color: black;
            background-color: whitesmoke;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="email"]:focus,
        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: blue;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        label {
            display: block;
            margin-bottom: 6px;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 600;
            color: black;
        }

        button {
            margin-top: 16px;
            display: inline-block;
            padding: 12px 28px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button[type="submit"]:hover {
            background-color: darkblue;
        }

        button[type="submit"]:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <form action="/enviar" method="post">
        <label for="nome">Nome completo</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required>
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Digite seu email" required>
        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
        <label for="data">Data</label>
        <input type="date" name="nome" id="data" placeholder="Digite a data" required>
        <label for="mensagem">Mensagem</label>
        <textarea name="mensagem" id="mensagem" rows="4" placeholder="Escreva aqui sua mensagem..."></textarea>
        <label for="turma">Turma</label>
        <select name="turma" id="turma" required>
            <option value="">Selecione...</option>
            <option value="1AMS">1º AMS</option>
            <option value="2AMS">2º AMS</option>
            <option value="3AMS">3º AMS</option>
        </select>

        <button type="submit">Enviar</button>
        <!--button type="reset">Limpar</button>-->
    </form>

</body>

</html>
